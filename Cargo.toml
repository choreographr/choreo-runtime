[package]
name = "acuity-runtime"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false, features = ["derive"] }
# Direct dependency beside the polkadot-sdk umbrella feature: the
# `register_validate_block!` proc macro resolves this crate by name from
# Cargo.toml (via proc-macro-crate), so the umbrella re-export alone is not
# enough for it. Must stay on the umbrella's version or two copies appear.
cumulus-pallet-parachain-system = { version = "0.31.0", default-features = false }
pallet-account-content = { git = "https://github.com/choreographr/pallet-content", branch = "master", default-features = false }
pallet-account-profile = { git = "https://github.com/choreographr/pallet-content", branch = "master", default-features = false }
pallet-content = { git = "https://github.com/choreographr/pallet-content", branch = "master", default-features = false }
pallet-content-reactions = { git = "https://github.com/choreographr/pallet-content", branch = "master", default-features = false }
polkadot-sdk = { version = "2609.0.0", default-features = false, features = [
    "runtime",
    "cumulus-pallet-aura-ext",
    "cumulus-pallet-parachain-system",
    "cumulus-primitives-core",
    "cumulus-primitives-parachain-inherent",
    "pallet-aura",
    "pallet-balances",
    "pallet-sudo",
    "pallet-timestamp",
    "pallet-transaction-payment",
    "pallet-transaction-payment-rpc-runtime-api",
    "pallet-utility",
    "staging-parachain-info",
] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }

[dev-dependencies]
# Builds a fake relay-chain storage proof so tests can supply the
# `set_validation_data` inherent a parachain block requires.
cumulus-test-relay-sproof-builder = "0.28.0"

[build-dependencies]
polkadot-sdk = { version = "2609.0.0", default-features = false, features = ["substrate-wasm-builder"] }

[features]
default = ["std"]
runtime-benchmarks = [
    "cumulus-pallet-parachain-system/runtime-benchmarks",
    "pallet-account-content/runtime-benchmarks",
    "pallet-account-profile/runtime-benchmarks",
    "pallet-content/runtime-benchmarks",
    "pallet-content-reactions/runtime-benchmarks",
    "polkadot-sdk/runtime-benchmarks",
]
std = [
    "codec/std",
    "cumulus-pallet-parachain-system/std",
    "pallet-account-content/std",
    "pallet-account-profile/std",
    "pallet-content/std",
    "pallet-content-reactions/std",
    "polkadot-sdk/std",
    "scale-info/std",
    "serde_json/std",
]

# Dev profile (the default for `cargo build` / `cargo run` / `cargo test`).
# debug = "line-tables-only": emit line tables (file:line for backtraces)
# without full debug info — cuts compile time and artifact size vs the default
# full debuginfo while still giving usable backtraces during development.
#
# rustflags (requires the [unstable] profile-rustflags opt-in in
# .cargo/config.toml; nightly-only — see rust-toolchain.toml): auto-applied to
# every adhoc `cargo` command under the nightly default toolchain, including
# `cargo build` / `cargo check` / `cargo nextest run`.
# - -Zshare-generics=yes: emit each generic monomorphization once per crate
#   graph instead of once per using crate — the big dev-build win. Deliberately
#   dev-ONLY: it has a history of codegen bugs under optimization, and with no
#   LTO in the release profile there is no link-time dedup to compare against.
# - -Zunstable-options + --jobs-frontend=0: parallelize the rustc query
#   frontend across one thread per logical core (0 = available_parallelism).
# - -C target-cpu=native: build for the LOCAL machine's CPU so every local
#   build is tuned for the box it runs on. This is dev-ONLY and deliberately
#   never reaches a shipped artifact or the wasm build: the wasm build uses the
#   `release` profile (see substrate-wasm-builder) and shipped binaries use the
#   `dist` profile, both of which carry no `target-cpu=native`. KEEP THE ARRAY
#   ON ONE LINE: build-stable.sh strips `^rustflags = [` lines exactly; a
#   multi-line array would leave dangling entries in the stripped manifest.
[profile.dev]
debug = "line-tables-only"
rustflags = ["-Zunstable-options", "--jobs-frontend=0", "-Zshare-generics=yes", "-C", "target-cpu=native"]

# Dev-loop release profile: optimized (opt-level 3, the release default) but
# links FAST — no LTO and no single-codegen-unit serialization — so `just build`
# / `just benchmark` iterate quickly. The slow-link codegen lives only in the
# `dist` profile below (the shipped-artifact path).
[profile.release]
opt-level = 3

# Shipped-artifact profile (used by cargo-dist). Inherits release's opt-level
# but adds the expensive-but-optimal codegen that the release profile keeps off
# to keep local linking fast:
# - lto = "thin": cross-crate inlining/optimization at link time (slower link)
# - codegen-units = 1: serialize codegen for maximum optimization (slower compile)
# - incremental = false: no incremental cache (deterministic, smaller artifacts)
# - strip = "symbols": cut shipped size; panic messages keep their file:line
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
incremental = false
strip = "symbols"
